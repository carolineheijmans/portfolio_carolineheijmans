<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logos — Caroline Heijmans</title>
  <meta name="description" content="Logo work by Caroline Heijmans.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <span class="topbar__slot">Freelance</span>
      <span class="topbar__slot">Caroline Heijmans</span>
      <nav class="menu" aria-label="Back to homepage">
        <a class="link" href="index.html">Homepage</a>
      </nav> 
    </header>

    <main class="desktop">
      <h1 class="hero__title">Logos</h1>
      <div class="gallery">
        <figure class="gallery__item">
          <img class="gallery__img" src="logos/logo_becol.png" alt="Becol logo">
          <figcaption class="gallery__caption">Becol</figcaption>
        </figure>
        <figure class="gallery__item">
          <img class="gallery__img" src="logos/logo_odn.png" alt="Odn logo">
          <figcaption class="gallery__caption">Odn</figcaption>
        </figure>
        <figure class="gallery__item">
          <img class="gallery__img" src="logos/logo_girafons.png" alt="Girafons logo">
          <figcaption class="gallery__caption">Girafons</figcaption>
        </figure>
        <figure class="gallery__item">
          <img class="gallery__img" src="logos/logo_spoons.png" alt="Spoons logo">
          <figcaption class="gallery__caption">Spoons</figcaption>
        </figure>
      </div>
    </main>

    <footer class="footer">
       <nav class="footer__links" aria-label="Social">
        <a class="link" href="https://www.linkedin.com/in/caroline-heijmans-99a24a235/">LinkedIn</a>
        <a class="link" href="mailto:caroline.heijmans@hotmail.be">Contact me</a>
      </nav>
    </footer>
  </div>

</html>
