<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prints — Caroline Heijmans</title>
  <meta name="description" content="Print work by Caroline Heijmans.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <span class="topbar__slot">Freelance</span>
      <span class="topbar__slot">Caroline Heijmans</span>
      <nav class="menu" aria-label="Back to homepage">
        <a class="link" href="index.html">Homepage</a>
      </nav> 
    </header>

    <main class="desktop">
      <h1 class="hero__title">Prints</h1>
      <p class="hero__subtitle">Need a print for your appartment ? Let's talk ! </p>
      <div class="gallery">
        <figure class="gallery__item">
          <img class="gallery__img" src="prints/artsy.png" alt="Artsy">
          <figcaption class="gallery__caption">Artsy</figcaption>
        </figure>
        <figure class="gallery__item">
          <img class="gallery__img" src="prints/bobby.png" alt="Bobby print">
          <figcaption class="gallery__caption">Bobby</figcaption>
        </figure>
        <figure class="gallery__item">
          <img class="gallery__img" src="prints/dakhla.png" alt="Dakhla print">
          <figcaption class="gallery__caption">Dakhla</figcaption>
        </figure>
        <figure class="gallery__item">
          <img class="gallery__img" src="prints/summer.png" alt="Summer print">
          <figcaption class="gallery__caption">Summer</figcaption>
        </figure>
        <figure class="gallery__item">
          <img class="gallery__img" src="prints/poule_sans_tete.png" alt="Poule Sans Tête print">
          <figcaption class="gallery__caption">Poule</figcaption>
        </figure>
        <figure class="gallery__item">
          <img class="gallery__img" src="prints/vache_a_lait.png" alt="Vache à Lait print">
          <figcaption class="gallery__caption">Vache à Lait</figcaption>
        </figure>
      </div>
    </main>

    <footer class="footer">
       <nav class="footer__links" aria-label="Social">
        <a class="link" href="https://www.linkedin.com/in/caroline-heijmans-99a24a235/">LinkedIn</a>
        <a class="link" href="mailto:caroline.heijmans@hotmail.be">Contact me</a>
      </nav>
    </footer>
  </div>
</body>
</html>
